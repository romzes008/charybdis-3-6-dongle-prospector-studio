# This file generates the GitHub Actions matrix.
# For simple board + shield combinations, add them to the top level board and
# shield arrays, for more control, add individual board + shield combinations
# to the `include` property. You can also use the `cmake-args` property to
# pass flags to the build command and `artifact-name` to assign a name to
# distinguish build outputs from each other:
#
# board: [ "nice_nano_v2" ]
# shield: [ "corne_left", "corne_right" ]
# include:
#   - board: bdn9_rev2
#   - board: nice_nano_v2
#     shield: reviung41
#   - board: nice_nano_v2
#     shield: corne_left
#     cmake-args: -DCONFIG_ZMK_USB_LOGGING=y
#     artifact-name: corne_left_with_logging
#
---
include:
  - board: nice_nano/nrf52840/zmk
    shield: charybdis_dongle
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y
    artifact-name: dongle
  
  - board: xiao_ble//zmk
    shield: charybdis_dongle prospector_adapter
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y
    artifact-name: prospector
  
  - board: nice_nano/nrf52840/zmk
    shield: settings_reset
    artifact-name: reset
  
  - board: nice_nano/nrf52840/zmk
    shield: charybdis_left
    artifact-name: left
  
  - board: nice_nano/nrf52840/zmk
    shield: charybdis_right
    artifact-name: right

  # Diagnostic builds: USB serial logs, same matrix and BLE roles.
  # Keep Studio RPC off these builds so the serial port carries only logs.
  - board: nice_nano/nrf52840/zmk
    shield: charybdis_dongle
    snippet: zmk-usb-logging
    cmake-args: -DCONFIG_ZMK_STUDIO=n -DCONFIG_ZMK_LOG_LEVEL_DBG=y
    artifact-name: dongle-debug

  - board: nice_nano/nrf52840/zmk
    shield: charybdis_right
    snippet: zmk-usb-logging
    # Preserve sensor startup logs until the USB serial port is opened.
    cmake-args: -DCONFIG_ZMK_LOG_LEVEL_DBG=y -DCONFIG_USB_CDC_ACM_RINGBUF_SIZE=16384
    artifact-name: right-debug

  - board: nice_nano/nrf52840/zmk
    shield: charybdis_left
    snippet: zmk-usb-logging
    cmake-args: -DCONFIG_ZMK_LOG_LEVEL_DBG=y
    artifact-name: left-debug
